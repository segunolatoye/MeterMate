<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none">
  <defs>
    <linearGradient id="topGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0EA5E9" />
    </linearGradient>
    <linearGradient id="leftGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="rightGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g transform="translate(15, 5)" filter="url(#shadow)">
    <!-- Isometric Cube Base -->
    <path d="M 50 5 L 94 30 L 50 55 L 6 30 Z" fill="url(#topGrad)" />
    <path d="M 6 30 L 50 55 L 50 105 L 6 80 Z" fill="url(#leftGrad)" />
    <path d="M 94 30 L 50 55 L 50 105 L 94 80 Z" fill="url(#rightGrad)" />
    
    <!-- White Isometric M -->
    <path d="M 24 75 V 42 L 50 57 L 76 42 V 75" stroke="#FFFFFF" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" />
  </g>
  
  <text x="145" y="80" font-family="ui-sans-serif, system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" fill="#F8FAFC" letter-spacing="-1px">
    Meter<tspan fill="#0EA5E9">Mate</tspan>
  </text>
</svg>
